spring:
  application:
    name: board-project
  profiles:
    active: local
  data: # ← 추가
    web:
      pageable:
        max-page-size: 50    # size를 아무리 크게 보내도 50으로 제한
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace